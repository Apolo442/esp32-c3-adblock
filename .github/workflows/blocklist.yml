name: blocklist

# Rebuilds the default blocklist weekly and publishes it at a stable URL:
#   https://github.com/Apolo442/esp32-c3-adblock/releases/download/blocklist/blocklist.bin
# Point a device's "Remote auto-update" at that URL and it stays current on its own.
on:
  schedule:
    - cron: "17 4 * * *"   # daily 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build blocklist — StevenBlack + Hagezi Pro, or Normal if Pro outgrows the flash
        run: |
          build() {
            python3 tools/build_blocklist.py blocklist.bin \
              https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts \
              "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/$1-onlydomains.txt" \
              2>&1 | tee -a build.log
          }
          build pro
          echo "LIST_NAME=Hagezi Pro" >> "$GITHUB_ENV"
          if [ "$(stat -c%s blocklist.bin)" -ge 1300000 ]; then
            echo "::warning::Hagezi Pro no longer fits the filesystem partition, falling back to Normal"
            build multi
            echo "LIST_NAME=Hagezi Normal" >> "$GITHUB_ENV"
          fi
      - name: Sanity checks
        run: |
          size=$(stat -c%s blocklist.bin)
          echo "size=$size bytes"
          test $((size % 5)) -eq 0                  # whole 40-bit entries
          test "$size" -gt 250000                   # >50k entries, catches a silently shrunk list
          test "$size" -lt 1300000                  # fits the dual-OTA filesystem partition
      - name: Publish to the 'blocklist' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          entries=$(( $(stat -c%s blocklist.bin) / 5 ))
          notes="Auto-built $(date -u +%F) — ${entries} entries (StevenBlack base + ${LIST_NAME}).

          Set this as the device's Remote auto-update URL:
          https://github.com/${{ github.repository }}/releases/download/blocklist/blocklist.bin"
          if gh release view blocklist >/dev/null 2>&1; then
            gh release edit blocklist --notes "$notes"
          else
            gh release create blocklist --title "Weekly blocklist" --notes "$notes" --latest=false
          fi
          gh release upload blocklist blocklist.bin --clobber
